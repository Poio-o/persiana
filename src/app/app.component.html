<div>
  <h1> {{titulo}} </h1>

  <button (click)="onConectarDesconectar($event)">Conectar</button>
  <div class="boton-leyenda">
    @if (this.corrienteVivienda) {
    <span>Corriente general: CONECTADA</span>
    } @else {
    <span>Corriente general: DESCONECTADA</span>
    }
  </div>

  <button (click)="onConectarDesconectarHab($event)">Conectar corriente Hab #1</button>
  <div class="boton-leyenda">
    @if (this.corrienteHab) {
    @if (this.abierta) {
    <span>Estado recibido: PERSIANA ABIERTA</span>
    } @else {
    <span>Estado recibido: PERSIANA CERRADA</span>
    }
    <app-habitacion (habitacionOutput)="onAbierta($event)"></app-habitacion>
    } @else {
    }
  </div>

</div>
